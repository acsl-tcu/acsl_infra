# 基幹イメージ (jazzy_x86) 更新時に nightly が再ビルドする派生イメージの連鎖。
# 形式: deploy | 入力イメージ (ITAG) | 出力タグ (OTAG) | dockerfile 名 (dockerfile.<name>)
#
# ・各 project の setup の dbuild 行と同期を保つこと (再ビルドはこのファイルが正)。
# ・上から順に dbuild される (前段の出力を次段が使うので順序に意味がある)。
# ・deploy の全許可 mode (targets.conf) が smoke PASS すると、その deploy の OTAG 群が
#   dpush され「正式イメージ」になる (run_nightly_audit.sh の昇格処理)。
# ・base 非由来 (third-party 起点: px4_sitl, isaac-sim6-jazzy, ardupilot_sitl 等) は
#   基幹更新の影響を受けないためここに載せない (従来どおり setup / dup auto-build 管理)。
# ・タグの _x86 は dbuild が uname から自動付与するので書いても書かなくてもよい
#   (arm ホストで同運用を始める場合はこのファイルをそのまま使える)。

drone | jazzy_x86          | image_drone2_x86   | drone2
drone | image_drone2_x86   | mavros2            | mavros2

rover | jazzy_x86          | image_rf_rover_x86 | rover
rover | jazzy_x86          | slam_toolbox       | slam_toolbox
rover | image_rf_rover_x86 | rplidar            | rplidar
rover | image_rf_rover_x86 | nav2               | nav2
rover | jazzy_x86          | microros           | microros
rover | jazzy_x86          | yolo               | yolo
