# 監査対象 (この PC で一元管理)。driver がスコープ確定で読む。
# 列: kind | name | path | project | modes
#   kind   : repo   = 静的解析の対象。編集/検証/PR はこのクローンで行う (ソース)。
#            deploy = backend-smoke の対象。コンテナを起動して検証する稼働 checkout。
#   path   : 絶対パス (~ 可)。存在しない行は driver が自動スキップ。
#   project: deploy のみ。project 名。
#   modes  : deploy のみ。backend-smoke で回してよい起動モード (カンマ区切り)。
#
# ★★ 安全境界 (ハードルール・絶対) ★★
#   この cron は実機に絶対に触れない。アクチュエーション (モーター/プロペラ/車輪の駆動)
#   を伴う一切を行わない。許すのは「危なくない＝アクチュエーションを含まない」検証のみ:
#     - SIM / SITL (純ソフトウェア) は OK。
#     - HITL は受動検証 (bringup・トピック publish 確認) まで OK。arm/takeoff/モーター/
#       cmd 送出など実駆動は禁止。
#     - EXP 系 (実機) は modes に書かない・回さない。
#   詳細は driver.md / themes/backend-smoke.md の安全則を参照。

repo   | acsl_infra       | ~/GitHub/sb/acsl_infra       | -        | -
repo   | project_rf_rover | ~/GitHub/sb/project_rf_rover | -        | -
repo   | project_drone2   | ~/GitHub/sb/project_drone2   | -        | -

deploy | rover            | ~/rover                      | rf_rover | SIM,isaacsim
deploy | drone            | ~/drone                      | drone2   | SIM,SITL_PX4,SITL_GZ_PX4,SITL_AP,SITL_OMNI

# 必要なら environment_* 等も repo 行で追加可。
# EXP 系 (実機アクチュエーション) は安全のため意図的に未記載。追加しないこと。
