services:
  image_build:
    # [build] call by dbuild command
    # service to run rosdep update && colcon build
    # TARGET_TAG : tag of build source image "acsl-common"
    # TAG : output image tag 
    # Example：TARGET_TAG=target TAG=output docker compose build common 
    #  kasekiguchi/acsl-common:target  =>  kasekiguchi/acsl-common:output
    image: kasekiguchi/acsl-common:${OTAG:-humble}
    build:
      context: .
      dockerfile: ${DF} # 実行するdockerfile指定
      #dockerfile: ${DOCKERFILE:-$ACSL_WORK_DIR/dockerfiles/dockerfile.${DF:-build}} # 実行するdockerfile指定
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble} # ROS distribution
        BASE_IMAGE: $BASE_IMAGE # 元となるimage
        # for x86 : osrf/ros:humble-desktop
        # for arch : arm64v8/ros:humble

  common:
    # [up] call by dup command
    # HOSTNAME : host pc name
    # CONTAINER_NAME : output container name
    # ROS_LAUNCH : shell script name containing ros2 start command in the container
    # LARGS : arguments to the ROS_LAUNCH file
    # ID : ROS_DOMAIN_ID
    tty: true
    privileged: true # privileged mode
    image: kasekiguchi/acsl-common:${TAG:-base}
    hostname: D${HOSTNAME:-rp5}
    container_name: ${CONTAINER_NAME:-dev}
    entrypoint:
      [
        "/root/.venv/bin/dumb-init", # for quick stop of the container
        "/common/scripts/entrypoint.sh" # execute at the container up
      ]
    command:
      # arguments for entrypoint.sh (refer to the entrypoint.sh file)
      [
        "/common/ros_launcher/${ROS_LAUNCH:-launch_dev.sh}",
        "${LARGS:-None}" # launch arguments
      ]
    working_dir: /root/ros2_ws
    environment:
      # set environment variable on docker 
      - PROJECT=${PROJECT}
      - CONTAINER_NAME=${COMPOSE_PROJECT_NAME:-dev}
      - TAG=${TAG:-image_${PROJECT}}
      - HOST_USER=$LOGNAME # deprecate 
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID} # set project unique id
      # FastDDS Discovery Server (ユニキャスト discovery)。既定は空 = 従来どおりマルチキャスト discovery
      - ROS_DISCOVERY_SERVER=${ROS_DISCOVERY_SERVER:-}
      - ROS_SUPER_CLIENT=${ROS_SUPER_CLIENT:-}
      - USER=$USER
      - ACSL_ROS2_DIR=$ACSL_ROS2_DIR
      - ACSL_WORK_DIR=$ACSL_WORK_DIR
      - x86=$x86
      - HOST_PATH=$PATH
      - RMW_IMPLEMENTATION=rmw_${RMW:-fastrtps}_cpp
      # DDS 転送。既定は「上限なしの UDPv4」= native Linux ホスト向け。
      # ローカルの大 latched メッセージ (/map ≈835KB 等) を同一ホストの別コンテナ
      # (例: slam_toolbox の RViz) がそのまま受け取れる。
      # 旧既定は max_msg_size=1400B で大メッセージを弾き、RViz が /map を受信できな
      # かった (発見はできるがデータが来ない)。native Linux では不要な制限。
      # robot 本体を WSL2 上で動かす場合のみ、IP フラグメント落ち対策として起動前に
      #   export FASTDDS_BUILTIN_TRANSPORTS='UDPv4?max_msg_size=1400B&sockets_size=4MB'
      # を明示する (監視 PC 側の受信設定は discovery_env.sh が別途生成する)。
      - "FASTDDS_BUILTIN_TRANSPORTS=${FASTDDS_BUILTIN_TRANSPORTS:-UDPv4}"
      # WSL2 監視PC で robot へ unicast discovery する FastDDS profile を渡す
      # (discovery_env.sh が生成・export)。既定は空 = 未使用 (通常起動に影響なし)。
      - FASTRTPS_DEFAULT_PROFILES_FILE=${FASTRTPS_DEFAULT_PROFILES_FILE:-}
      - ROS_USE_SIM_TIME=${ROS_USE_SIM_TIME:-false}
      - ENV_BUILDING=${ENV_BUILDING:-bld10} # active 建屋名 (environment_<name>)
      # WSL : thanks to : https://dev.classmethod.jp/articles/wsl2-docker-gui-app-windows-display/
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-0}
      - XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR
      - PULSE_SERVER=${PULSE_SERVER:-0}
    # ports:
    #   - 8080:8080

    volumes:
      # bind "host folder":"docker folder"
      - ${HOME}/.ssh:/root/.ssh
      - ./common:/common # common scripts
      - $ACSL_WORK_DIR/launcher:/common/ros_launcher
      # ~/ENV = 「環境に関する共有アセット」(ホスト単位で全プロジェクト共有)
      #   ~/ENV/<name>/repo : environment_<name> の git checkout (env_sync で配備、gpull で更新)
      #   ~/ENV/<name>/omni : git 管理外の巨大資産 (USD 等、従来どおり)
      #   コンテナからは /ENV/<name>/... で参照 (isaac_sim の -v $HOME/ENV:/ENV と同一規約)。
      # rw: node_capture / save_map / serialize がコンテナから書く
      #
      # 建屋ごとのバインドマウント ($ACSL_WORK_DIR/environments... や
      # .../${ENV_BUILDING}/occupancy) は廃止した。マウント元が存在しないと Docker が
      # **root 所有で自動生成**するため、その建屋を使わないプロジェクトが dup しただけで
      # 共有ツリーが root 所有で汚染され、以後 env_sync の clone が全プロジェクトで
      # 失敗するリスクがあったため (実例: ~/drone/environments/bld10 が root 所有で生成された)。
      # 旧来のパス (/root/environment/<name>) は entrypoint.sh が /ENV への symlink として
      # 用意するので、コンテナ内の参照は従来どおり動く。
      - ${HOME}/ENV:/ENV
      - /dev:/dev # GPIO and USB devices
      - vscode-server:/root/.vscode-server # VScode setting (preserve VScode extension)
      - $ACSL_WORK_DIR/packages:/root/ros2_ws/src/ros_packages
      - $ACSL_WORK_DIR/common:/root/ros2_ws/src/common:ro
      - $ACSL_WORK_DIR/Data:/root/ros2_ws/Data
      - $ACSL_WORK_DIR/config:/root/ros2_ws/config:ro
      - $ACSL_WORK_DIR/isaac_sim/config:/root/ros2_ws/isaac_sim/config:ro
      - $ACSL_WORK_DIR/.env:/root/ros2_ws/.env
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      # WSL
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg

    # ▼ use host network to connect external device
    #  Caution : set ROS_DOMAIN_ID properly to separate the namespace in ROS2
    network_mode: host
    #network_mode: bridge
    ipc: host
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 4g          
    device_cgroup_rules:
      # a (all), c (char), or b (block) 
      # https://www.kernel.org/doc/Documentation/admin-guide/devices.txt
      # require for Realsense
      - 'c 81:* rmw' # video4linux
      - 'c 189:* rmw' # USB serial converters - alternate devices

volumes:
  vscode-server: # named volume : preserve contents independent from containers
